[workspace]
members = ["dynamic", "hdr-macros", "utils"]

resolver = "2"

[workspace.package]
version = "0.0.0-dev"
authors = ["HDR Development Team"]
edition = "2021"

[workspace.dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs" }
skyline_smash = { git =  "https://github.com/blu-dev/skyline-smash", features = ["weak_l2cvalue"] }
skyline-web = { git = "https://github.com/skyline-rs/skyline-web" }
smashline = { git = "https://github.com/HDR-Development/smashline" }

dynamic = { path = "dynamic" }
hdr-macros = { path = "hdr-macros" }
utils = { path = "utils" }

[package]
name = "hdr"
version.workspace = true
authors.workspace = true
edition.workspace = true

[package.metadata.skyline]
titleid = "01006A800016E000"

[dependencies]
dynamic.workspace = true
locks = { git = "https://github.com/HDR-Development/smashline" }
hid-hdr = { git = "https://github.com/HDR-Development/hid-hdr", features = ["warnings"] }
once_cell = "1"
ninput = { git = "https://github.com/blu-dev/ninput" }
rand = { git = "https://github.com/skyline-rs/rand" }
serde = { version = "1", features = ["derive"] }
toml = "0.8.20"
parking_lot = "0.12.3"
runtime-motion-patcher.git = "https://github.com/blu-dev/runtime-motion-patcher"
skyline.workspace = true
skyline_smash.workspace = true
smashline.workspace = true
skyline-web = { workspace = true, optional = true }
utils.workspace = true
hash40 = "1.2.0"
smash-arc = { version = "0.6.0", features = ["rust-zstd", "smash-runtime"] }
smash2 = { git = "https://github.com/blu-dev/smash-rs", package = "smash"}

[features]
dev = ["utils/no-offset-search"]
main_nro = ["skyline-web"]
matchup = ["skyline-web"]
runtime = []

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 'z'
panic = "abort"
lto = true
codegen-units = 1

[lib]
crate-type = ["cdylib"]
